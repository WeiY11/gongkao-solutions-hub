  let cp=chip('复制本题解析');cp.onclick=()=>{let s='第'+DATA.set+'套 第'+curr+'题（原卷答案'+q.key+'）\n'+q.type+'\n'+q.fast+'\n'+q.detail+'\n'+q.tip;navigator.clipboard?.writeText(s)};a.append(cp);
  $('.ansbox').scrollTop=0;}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const nav=$('.navnums');for(let g=1;g<=4;g++){let d=document.createElement('section');d.className='navgroup';d.innerHTML='<div class="navlabel">第'+['一','二','三','四'][g-1]+'篇 <small>'+(g*5-4)+'—'+g*5+'</small></div>';let ns=document.createElement('div');ns.className='nums';for(let n=g*5-4;n<=g*5;n++){let b=document.createElement('button');b.className='nbtn';b.dataset.n=n;b.textContent=n;b.onclick=()=>goto(n);ns.append(b)}d.append(ns);nav.append(d)}

function tick(){secs++;$('.clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');if(secs%5===0)save()}
$('.clock').textContent='00:00';$('.timerbtn').onclick=()=>{run=!run;if(run){ticker=setInterval(tick,1000)}else{clearInterval(ticker)}$('.timerbtn').textContent=run?'暂停计时':'开始计时'};$('.resetbtn').onclick=()=>{if(confirm('确定清空本套答题记录和计时吗？')){picks={};secs=0;curr=1;save();$('.clock').textContent='00:00';render()}};
