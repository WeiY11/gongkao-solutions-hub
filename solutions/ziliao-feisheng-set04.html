function pretty(t){return String(t).replaceAll('＝',' = ').replaceAll('≈',' ≈ ').replaceAll('×',' × ').replaceAll('÷',' ÷ ')}
function chip(t,cls=''){let b=document.createElement('button');b.className='btn tiny '+cls;b.textContent=t;return b}
function imageShot(obj,forMarks=false){let fig=document.createElement('figure');fig.className='shot';fig.style.maxWidth=(obj.w||900)+'px';let im=document.createElement('img');im.src=obj.src;im.loading='eager';im.alt='原卷截图，源PDF第'+obj.page+'页';fig.append(im);if(forMarks&&highlight){let hits=DATA.marks[curr]?.[obj.id]||[];for(const rr of hits){let z=document.createElement('i');z.className='hilite';z.style.left=(rr[0]*100)+'%';z.style.top=(rr[1]*100)+'%';z.style.width=(rr[2]*100)+'%';z.style.height=(rr[3]*100)+'%';z.title=rr[4];fig.append(z)}}return fig}
function render(){const q=DATA.qs[curr];$('.chapter-label').textContent='第'+q.part+'篇 · 第'+curr+'题';$('.current-method').textContent=q.type;$('.current-page').textContent='原PDF第'+q.page+'页';$('.source-heading').textContent='第'+q.part+'篇 · 原始资料与图表';
  $$('.nbtn').forEach(b=>{let n=+b.dataset.n;b.classList.toggle('active',n===curr);b.classList.toggle('answered',!!picks[n]);});
  const qi=$('.questioninner');qi.replaceChildren();if(q.shots?.length){q.shots.forEach(x=>qi.append(imageShot(x,false)));}else{qi.innerHTML='<div class="sourcehelp">本题原图截取失败，请在下方原始资料区查看对应页。</div>'}
  const sc=$('.sourceinner');sc.replaceChildren();let n=0;for(const p of DATA.material[q.part]){let lb=document.createElement('div');lb.className='shot-label';lb.textContent='源PDF第'+p.page+'页 · '+p.label;sc.append(lb);let x=imageShot(p,true);n+=(DATA.marks[curr]?.[p.id]||[]).length;sc.append(x)}
  $('.highbtn').classList.toggle('warm',highlight);$('.highbtn').textContent=highlight?'☀ 关闭数据高亮':'☀ 高亮本题数据';$('.hcount').textContent=highlight?(n?'已标记'+n+'处相关位置':'本题需查看原图/图表'):'点开关可突出材料中的定位数字';
  for(const b of $$('.choice')){b.classList.toggle('sel',picks[curr]===b.dataset.opt)}
  const a=$('.ansbody');a.replaceChildren();if(!show){a.innerHTML='<div class="veil"><b>解析已隐藏</b><p>先看左栏原题，并尝试圈出需要的数据。<br>准备好后点击右上方「显示解析」。</p></div>';return}
  let intro=document.createElement('div');intro.className='rightintro';intro.innerHTML='<div class="ansbadge">'+q.key+'</div><div><h2>第'+curr+'题 · '+q.type+'</h2><p>原卷参考答案 '+q.key+' · 双栏对照解题</p></div>';a.append(intro);
  let mt=document.createElement('div');mt.className='methodtag';mt.textContent='方法标签：'+q.type;a.append(mt);
  function step(no,title,body){let d=document.createElement('section');d.className='step';let h=document.createElement('div');h.className='steptitle';h.innerHTML='<span class="stepnum">'+no+'</span>'+title;let c=document.createElement('div');c.className='stepcontent';c.textContent=pretty(body);d.append(h,c);a.append(d)}
  step('1','审题定位：明确要求量与数据口径','题干：'+q.stem+'\n题型：'+q.type+'。\n需优先定位：'+(q.words||'当前篇的对应年份与指标')+'。先核对同比/环比、数量/比重及数据单位。');
  step('2','最快路径：选项反推 / 范围估计',q.fast);
  step('3','完整推导与数据解释',q.detail);
  let tip=document.createElement('div');tip.className='skillhint';tip.innerHTML='<b>⚡ 陈怀安式速算检查</b><div>'+escapeHtml(q.skill)+'</div>';a.append(tip);
  let c=document.createElement('div');c.className='callout';c.innerHTML='<strong>⚠ 易错点与停止条件</strong><div>'+escapeHtml(q.tip)+'</div>';a.append(c);
  if(q.flag){let v=document.createElement('div');v.className='dispute';v.textContent=q.flag;a.append(v)}
  let bot=document.createElement('div');bot.className='bottomline';bot.innerHTML='<span>第'+DATA.set+'套 · 第'+curr+'题</span><span>先估算 → 验证选项边界 → 必要时定量修正</span>';a.append(bot);
  let cp=chip('复制本题解析');cp.onclick=()=>{let s='第'+DATA.set+'套 第'+curr+'题（原卷答案'+q.key+'）\n'+q.type+'\n'+q.fast+'\n'+q.detail+'\n'+q.tip;navigator.clipboard?.writeText(s)};a.append(cp);
  $('.ansbox').scrollTop=0;}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function goto(n){curr=Math.max(1,Math.min(20,n));save();render();$('.questionbox').scrollTop=0;$('.sourcebox').scrollTop=0;}
function locate(){let x=$('.sourcebox'),el=x.querySelector('.hilite');if(el){let parent=el.closest('.shot');x.scrollTo({top:parent.offsetTop+el.offsetTop-90,behavior:'smooth'});}else{x.scrollTo({top:0,behavior:'smooth'})}}
const nav=$('.navnums');for(let g=1;g<=4;g++){let d=document.createElement('section');d.className='navgroup';d.innerHTML='<div class="navlabel">第'+['一','二','三','四'][g-1]+'篇 <small>'+(g*5-4)+'—'+g*5+'</small></div>';let ns=document.createElement('div');ns.className='nums';for(let n=g*5-4;n<=g*5;n++){let b=document.createElement('button');b.className='nbtn';b.dataset.n=n;b.textContent=n;b.onclick=()=>goto(n);ns.append(b)}d.append(ns);nav.append(d)}
$$('.choice').forEach(b=>b.onclick=()=>{picks[curr]=b.dataset.opt;save();render()});
$('.highbtn').onclick=()=>{highlight=!highlight;save();render()};$('.locatebtn').onclick=locate;
$('.toggleans').onclick=()=>{show=!show;$('.toggleans').textContent=show?'隐藏解析':'显示解析';render()};
$('.prevbtn').onclick=()=>goto(curr-1);$('.nextbtn').onclick=()=>goto(curr+1);$('.qratio').oninput=e=>{$('.questionbox').style.height=e.target.value+'%';$('.ratiolabel').textContent=e.target.value+'%'};
function tick(){secs++;$('.clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');if(secs%5===0)save()}
$('.clock').textContent='00:00';$('.timerbtn').onclick=()=>{run=!run;if(run){ticker=setInterval(tick,1000)}else{clearInterval(ticker)}$('.timerbtn').textContent=run?'暂停计时':'开始计时'};$('.resetbtn').onclick=()=>{if(confirm('确定清空本套答题记录和计时吗？')){picks={};secs=0;curr=1;save();$('.clock').textContent='00:00';render()}};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&e.altKey)goto(curr+1);else if(e.key==='ArrowLeft'&&e.altKey)goto(curr-1)});
$('.clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');render();</script><script>
(function(){
  var box=document.querySelector('.headtitle > div:last-child');
  if(!box)return;
  var a=document.createElement('a');
  a.href='../index.html';
  a.textContent='\u2190 \u8fd4\u56de\u89e3\u9898\u5bfc\u822a';
  a.style.cssText='display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:#209e91;text-decoration:none;letter-spacing:.3px';
  a.addEventListener('mouseenter',function(){a.style.textDecoration='underline'});
  a.addEventListener('mouseleave',function(){a.style.textDecoration='none'});
  box.appendChild(a);
})();
</script>
</body></html>
